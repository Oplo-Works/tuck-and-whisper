<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f5f0e6">
<title>Tuck and Whisper</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('taw-theme')==='dusk'?'dusk':'paper'}catch{document.documentElement.dataset.theme='paper'}</script>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="design.css"></head><body>
<header><div class="brand-row"><div class="brand"><span class="brand-symbol" data-icon="moon" aria-hidden="true"></span><h1>Tuck and Whisper</h1></div></div><p>You missed the moment. You don't have to miss the story.</p><div class="header-tools"><select id="lang-select" aria-label="Language"></select><button id="theme-toggle" type="button" aria-pressed="false"><span></span></button></div></header>
<main>
<p id="language-note" class="hint" hidden data-copy="translation"></p>
<div id="storage-warning" class="error" role="alert" hidden><p id="storage-text"></p><p id="storage-code" class="hint" hidden></p><button id="retry-save" data-copy="retrySave" hidden></button><button id="start-fresh" data-copy="startFresh" hidden></button><button id="download-draft" data-copy="downloadDraft" data-icon="download"></button><button id="reload-record" data-copy="reload"></button></div>
<p id="save-status" class="hint" aria-live="polite"></p><p id="message" role="status" aria-live="polite" class="notice" hidden></p>
<nav aria-label="Steps"><button id="nav-capture" data-copy="stepCapture" data-icon="note"></button><button id="nav-review" data-copy="stepReview" data-icon="review"></button><button id="nav-preview" data-copy="stepRead" data-icon="book"></button><button id="nav-library" data-copy="stepLibrary" data-icon="library" disabled></button></nav>
<p id="next-action" class="notice" role="status"></p>
<section id="screen-capture"><div class="card"><h2 tabindex="-1" data-copy="capture"></h2>
<p class="hint" data-copy="captureHint"></p>
<div id="photo-section">
<label for="photo-input" data-copy="photo" data-icon="photo"></label><input type="file" id="photo-input" accept="image/*" aria-describedby="photo-help"><p id="photo-status" class="hint"></p>
<p id="photo-help" class="hint" data-copy="photoSkip"></p></div>
<div id="memo-section">
<label for="memo-input" data-copy="memo" data-icon="note"></label><textarea id="memo-input" rows="5" aria-describedby="voice-warning"></textarea>
<p class="hint" data-copy="memoWays"></p>
<details><summary data-copy="voice" data-icon="voice"></summary><p class="hint" data-copy="voiceInfo"></p><input type="file" id="voice-input" accept="audio/*,.m4a" aria-label="Audio"><button id="transcribe-btn" data-copy="transcribe"></button></details><p id="voice-warning" data-copy="voiceReplace"></p>
</div>
<div id="preparation-notes">
<details id="capture-privacy"><summary data-copy="privacySummary" data-icon="shield"></summary><p class="hint" data-copy="inputPrivacy"></p><p class="hint" data-copy="retention"></p></details>
<p class="hint" data-copy="voiceCheck"></p><p id="voice-progress" class="notice" role="status" data-copy="voiceBusy" hidden></p>
</div>
<button id="extract-btn" class="primary" data-copy="extract" data-icon="arrow"></button>
</div><div class="reset-actions"><button id="new-day-btn" data-copy="newDay" data-icon="trash"></button></div>
<button id="library-btn" data-copy="library" data-icon="library" hidden></button></section>
<section id="screen-review" hidden><div class="card"><h2 tabindex="-1" data-copy="review"></h2><p data-copy="skipped" class="hint"></p><p id="selection-count"></p>
<div id="memo-candidates"></div><details id="photo-details"><summary data-copy="photoGroup"></summary><div id="photo-preview"></div><div id="photo-candidates"></div></details>
<p id="identity-hint" class="hint" data-copy="identityHint"></p>
<details id="identity-details"><summary data-copy="identity" data-icon="shield"></summary><p class="hint" data-copy="noImage"></p>
<label for="identity-people" data-copy="people"></label><select id="identity-people"></select>
<label for="identity-animals" data-copy="animals"></label><select id="identity-animals"></select></details>
<div class="sticky-actions"><button id="prepare-btn" class="primary" data-copy="prepare" data-icon="arrow"></button><button id="edit-input" data-copy="edit"></button></div></div></section>
<section id="screen-preview" hidden><div class="card"><h2 tabindex="-1" data-copy="preview"></h2><p id="restricted-notice" class="notice" data-copy="noMemo" hidden></p>
<div id="briefing"></div><p id="briefing-status" aria-live="polite"></p><button id="briefing-retry" data-copy="remakeBriefing"></button>
<h3 data-copy="question"></h3><textarea id="question-text" rows="4" aria-label="Question"></textarea><p id="question-meta" class="hint"></p><button id="another-question" data-copy="another"></button>
<p class="hint" data-copy="retention"></p><button id="open-bedtime" class="primary" data-copy="read" data-icon="book"></button>
<details class="audit"><summary data-copy="audit"></summary><div id="preview-audit"></div></details></div></section>
<section id="screen-bedtime" hidden><div class="card"><h2 tabindex="-1" data-copy="bedtime"></h2><h3 id="reading-title"></h3><p id="reading-date" class="hint"></p><div id="reading-art"></div><div id="para-art-tools" hidden><button id="para-art-all" data-copy="paraArtAll"></button><p id="para-art-hint" class="hint"></p></div><div id="story" class="story"></div><p id="story-status" aria-live="polite"></p>
<h3 data-copy="question"></h3><p id="reading-question" class="recall-question"></p>
<details><summary data-copy="parentTools"></summary><button id="story-retry" data-copy="remakeStory"></button><button id="style-btn" data-copy="style"></button>
<p id="art-message" class="hint" data-copy="noImage"></p><div id="art-preview"></div><div id="art-approval" hidden><p data-copy="artworkReview"></p><button id="accept-art" data-copy="acceptArt"></button><button id="reject-art" data-copy="rejectArt"></button></div></details>
<details class="audit"><summary data-copy="audit"></summary><div id="bedtime-audit"></div></details>
<div id="testimony-area"><label for="testimony-input" data-copy="testimony"></label><p id="testimony-help" class="hint" data-copy="testimonyHint"></p><input type="text" id="testimony-input" aria-describedby="testimony-help"><button id="save-testimony" data-copy="saveWords" data-icon="talk"></button><div id="testimony-list"></div></div>
<div id="book-tools" hidden><div id="book-details" hidden><label for="book-title" data-copy="bookTitle"></label><input id="book-title" type="text"><label for="event-date" data-copy="eventDate"></label><input id="event-date" type="date"><p class="hint" data-copy="bookDetailsHint"></p></div><p id="book-save-status" role="status"></p><p class="hint" data-copy="bookPolicy"></p><button id="save-book" data-copy="saveBook" data-icon="save"></button><button id="export-book" data-copy="export" data-icon="download"></button></div>
</div></section>
<section id="screen-library" hidden><div class="card"><h2 tabindex="-1" data-copy="library"></h2><div id="books"></div><button id="delete-all" data-copy="deleteAll" data-icon="trash"></button></div></section>
<dialog id="book-dialog"><form method="dialog"><button data-copy="back"></button></form><p id="book-note"></p><div id="book-content"></div><div id="export-options" hidden><label class="use"><input type="checkbox" id="export-text-only"><span data-copy="textOnly"></span></label><button id="download-book" data-copy="download"></button></div></dialog>
</main><footer>build: warm-paper (shell v30)</footer>
<script src="core.js"></script><script src="workflow.js"></script><script src="storage.js"></script><script src="books.js"></script><script src="books-ui.js"></script><script src="i18n.js"></script><script src="copy.js"></script><script src="ui.js"></script>
<script src="api.js"></script><script src="app.js"></script>
</body></html>
